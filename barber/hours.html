<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Working Hours — BarberHub NG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Working Hours</h1>
  <p><a href="dashboard.html">← Back to Dashboard</a></p>

  <form id="hoursForm">
    <div id="daysContainer">Loading...</div>
    <br>
    <button type="submit">Save Hours</button>
  </form>
  <p id="message"></p>

  <script src="../shared/js/supabase-client.js"></script>
  <script>
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const HOURS_12 = Array.from({length: 12}, (_, i) => i + 1);
    const MINUTES = ['00', '15', '30', '45'];
    let businessId = null;

    function timeSelectHTML(prefix, day) {
      const hourOptions = HOURS_12.map(h => `<option value="${h}">${h}</option>`).join('');
      const minOptions = MINUTES.map(m => `<option value="${m}">${m}</option>`).join('');
      return `
        <select class="${prefix}Hour" data-day="${day}">${hourOptions}</select> :
        <select class="${prefix}Min" data-day="${day}">${minOptions}</select>
        <select class="${prefix}Ampm" data-day="${day}">
          <option value="AM">AM</option>
          <option value="PM">PM</option>
        </select>
      `;
    }

    function to24Hour(hour12, min, ampm) {
      let h = parseInt(hour12);
      if (ampm === 'AM' && h === 12) h = 0;
      if (ampm === 'PM' && h !== 12) h += 12;
      return String(h).padStart(2, '0') + ':' + min;
    }

    function from24Hour(timeStr) {
      const [hStr, mStr] = timeStr.split(':');
      let h = parseInt(hStr);
      const ampm = h >= 12 ? 'PM' : 'AM';
      let h12 = h % 12;
      if (h12 === 0) h12 = 12;
      const min = MINUTES.includes(mStr) ? mStr : '00';
      return { hour: h12, min, ampm };
    }

    function setSelectValues(prefix, day, hour, min, ampm) {
      document.querySelector(`.${prefix}Hour[data-day="${day}"]`).value = hour;
      document.querySelector(`.${prefix}Min[data-day="${day}"]`).value = min;
      document.querySelector(`.${prefix}Ampm[data-day="${day}"]`).value = ampm;
    }

    function renderDays(existingHours) {
      const container = document.getElementById('daysContainer');
      const byDay = {};
      existingHours.forEach(h => { byDay[h.day_of_week] = h; });

      container.innerHTML = DAYS.map((dayName, i) => {
        const existing = byDay[i];
        const isClosed = existing ? existing.is_closed : false;

        return `
          <div style="border:1px solid #ccc; padding:8px; margin-bottom:8px;">
            <strong>${dayName}</strong><br>
            <label>
              <input type="checkbox" class="closedCheckbox" data-day="${i}" ${isClosed ? 'checked' : ''}>
              Closed
            </label><br>
            Open: ${timeSelectHTML('open', i)}<br>
            Close: ${timeSelectHTML('close', i)}
          </div>
        `;
      }).join('');

      DAYS.forEach((_, i) => {
        const existing = byDay[i];
        const openParts = from24Hour(existing && existing.open_time ? existing.open_time : '09:00');
        const closeParts = from24Hour(existing && existing.close_time ? existing.close_time : '18:00');
        setSelectValues('open', i, openParts.hour, openParts.min, openParts.ampm);
        setSelectValues('close', i, closeParts.hour, closeParts.min, closeParts.ampm);
      });
    }

    async function loadHours() {
      const { data: hours, error } = await supabaseClient
        .from('business_hours')
        .select('day_of_week, open_time, close_time, is_closed')
        .eq('business_id', businessId);

      if (error) {
        document.getElementById('daysContainer').textContent = 'Failed to load: ' + error.message;
        return;
      }

      renderDays(hours || []);
    }

    document.getElementById('hoursForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageEl = document.getElementById('message');
      messageEl.textContent = 'Saving...';

      const rows = DAYS.map((_, i) => {
        const isClosed = document.querySelector(`.closedCheckbox[data-day="${i}"]`).checked;

        const openHour = document.querySelector(`.openHour[data-day="${i}"]`).value;
        const openMin = document.querySelector(`.openMin[data-day="${i}"]`).value;
        const openAmpm = document.querySelector(`.openAmpm[data-day="${i}"]`).value;

        const closeHour = document.querySelector(`.closeHour[data-day="${i}"]`).value;
        const closeMin = document.querySelector(`.closeMin[data-day="${i}"]`).value;
        const closeAmpm = document.querySelector(`.closeAmpm[data-day="${i}"]`).value;

        return {
          business_id: businessId,
          day_of_week: i,
          open_time: isClosed ? null : to24Hour(openHour, openMin, openAmpm),
          close_time: isClosed ? null : to24Hour(closeHour, closeMin, closeAmpm),
          is_closed: isClosed
        };
      });

      const { error } = await supabaseClient
        .from('business_hours')
        .upsert(rows, { onConflict: 'business_id,day_of_week' });

      if (error) {
        messageEl.textContent = 'Failed to save: ' + error.message;
        return;
      }

      messageEl.textContent = 'Hours saved!';
    });

    (async () => {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData.session) {
        window.location.href = 'login.html';
        return;
      }

      const userId = sessionData.session.user.id;

      const { data: business, error } = await supabaseClient
        .from('businesses')
        .select('id')
        .eq('owner_id', userId)
        .maybeSingle();

      if (error || !business) {
        document.getElementById('daysContainer').textContent =
          'You need to create a business first.';
        document.getElementById('hoursForm').style.display = 'none';
        return;
      }

      businessId = business.id;
      loadHours();
    })();
  </script>
</body>
</html>

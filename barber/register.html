<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Your Business — BarberHub NG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Register Your Business</h1>
  <form id="registerForm">
    <label>Full Name<br>
      <input type="text" id="fullName" required>
    </label><br><br>
    <label>Email<br>
      <input type="email" id="email" required>
    </label><br><br>
    <label>Password<br>
      <input type="password" id="password" required minlength="6">
    </label><br><br>
    <label>Phone<br>
      <input type="tel" id="phone" required>
    </label><br><br>
    <button type="submit">Create Account</button>
  </form>
  <p id="message"></p>

  <script src="../shared/js/supabase-client.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageEl = document.getElementById('message');
      messageEl.textContent = 'Creating account...';

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value.trim();

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName, role: 'barber' }
        }
      });

      if (error) {
        messageEl.textContent = 'Registration failed: ' + error.message;
        return;
      }

      const userId = data.user?.id;
      if (userId && phone) {
        await supabaseClient.from('profiles').update({ phone }).eq('id', userId);
      }

      messageEl.textContent = 'Account created! Check your email to confirm, then log in.';
      document.getElementById('registerForm').reset();
    });
  </script>
</body>
</html>
